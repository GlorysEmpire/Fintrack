<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0c1210" />
    <title>FinTrack is offline</title>
    <style>
      body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #0c1210; color: #e8f3ef; font-family: system-ui, -apple-system, "Segoe UI", sans-serif; text-align: center; padding: 24px; box-sizing: border-box; }
      main { max-width: 360px; }
      h1 { font-size: 20px; margin: 0 0 12px; }
      p { color: #9db3ab; line-height: 1.5; margin: 0 0 12px; }
      button { background: #34d399; color: #04110c; border: 0; border-radius: 10px; padding: 12px 20px; font-size: 16px; font-weight: 600; }
    </style>
  </head>
  <body>
    <main>
      <h1>You are offline</h1>
      <p>FinTrack needs a connection to show your money. Nothing is saved on this phone, so your figures are never out of date or visible to anyone else.</p>
      <p>Reconnect, then try again.</p>
      <button type="button" onclick="location.reload()">Try again</button>
    </main>
  </body>
</html>
