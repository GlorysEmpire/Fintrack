# Runs on every push and pull request. It never touches production: the
# database here is a throwaway PostgreSQL service created for the run, and no
# deployment secret is used.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: fintrack
          POSTGRES_PASSWORD: fintrack
          POSTGRES_DB: fintrack_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fintrack"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Apply every migration to the throwaway database
        working-directory: apps/web
        run: npx prisma migrate deploy
        env:
          DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack_test

      - name: Type check (builds the domain package first)
        run: npm run lint

      - name: Domain tests
        run: npm run test:domain

      - name: Web tests on the in-memory database
        working-directory: apps/web
        run: npx vitest run

      - name: Web tests on real PostgreSQL
        working-directory: apps/web
        run: npx vitest run
        env:
          # Local, throwaway, and the name contains "test": the test harness refuses anything else
          TEST_DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack_test

      - name: Install Chromium for the end-to-end tests
        working-directory: apps/web
        run: npx playwright install --with-deps chromium

      - name: End-to-end tests (real browser, throwaway database)
        working-directory: apps/web
        run: npx playwright test
        env:
          # The Playwright config refuses anything that is not a local database named "...test..."
          E2E_DATABASE_URL: postgresql://fintrack:fintrack@localhost:5432/fintrack_test

      - name: Dependency audit (fails on critical in production dependencies)
        run: npm audit --omit=dev --audit-level=critical
